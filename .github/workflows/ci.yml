name: ci

on:
  push:
    branches: [main]
    tags-ignore: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v9
      - name: "PR: commit subjects"
        if: github.event_name == 'pull_request'
        run: scripts/check-branch-msgs.sh "${{ github.event.pull_request.base.sha }}"
      - name: Every check and the tests of every addon
        run: nix flake check

  release:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag a new version and create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci-release.sh
